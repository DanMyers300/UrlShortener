<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 0 16px;
    }
    h1 { margin-bottom: 24px; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover { background: #005bb5; }
    #result {
      margin-top: 24px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 4px;
      display: none;
    }
    #result a { word-break: break-all; }
    #error {
      margin-top: 16px;
      color: red;
      display: none;
    }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input type="text" id="urlInput" placeholder="https://example.com/very/long/url" />
  <button onclick="shorten()">Shorten</button>
  <div id="error"></div>
  <div id="result">
    Short URL: <a id="shortLink" href="#" target="_blank"></a>
  </div>

  <script>
    async function shorten() {
      const url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      const errorDiv = document.getElementById('error');
      const shortLink = document.getElementById('shortLink');

      resultDiv.style.display = 'none';
      errorDiv.style.display = 'none';

      const res = await fetch('/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      if (!res.ok) {
        const msg = await res.text();
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        return;
      }

      const data = await res.json();
      const short = `${location.origin}/${data.code}`;
      shortLink.href = short;
      shortLink.textContent = short;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
