services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build: .
    volumes:
      - db-data:/app/data
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/urlshortener.db

volumes:
  db-data:
  caddy-data:
  caddy-config:
